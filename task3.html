<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links, Lists and Tables</title>
</head>
<body>

    <!-- HTML Links -->
    <a href="https://www.google.com">Visit Google</a>
    <br>

    <a href="#about">Go to About Section</a>

    <!-- About Section -->
    <h2 id="about">About Us</h2>

    <!-- HTML Image -->
    <img src="image.jpg" alt="My Image" width="300">

    <!-- Ordered List -->
    <h3>Web Development</h3>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <!-- Unordered List -->
    <h3>Programming Languages</h3>
    <ul>
        <li>C++</li>
        <li>Python</li>
        <li>Java</li>
    </ul>

    <!-- Nested List -->
    <h3>Development Categories</h3>
    <ul>
        <li>Frontend
            <ol>
                <li>HTML</li>
                <li>CSS</li>
            </ol>
        </li>
    </ul>

    <!-- HTML Table -->
    <h3>Student Details</h3>
    <table border="1">

        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Gopal</td>
            <td>B.Tech CSE</td>
            <td>20</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>B.Tech IT</td>
            <td>21</td>
        </tr>

    </table>

</body>
</html>
